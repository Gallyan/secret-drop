# Continuous Deployment - Déploiement automatique sur VPS
#
# Ce workflow se déclenche automatiquement après le succès du CI sur main.
# Il peut aussi être déclenché manuellement via workflow_dispatch.
#
# Les assets sont buildés dans GitHub Actions puis transférés sur le serveur.
# Node.js/npm ne sont pas nécessaires en production.
#
# En fin de déploiement, IndexNow n'est notifié que si le pull a réellement
# modifié du contenu éditorial (traductions, vues publiques, liste des locales).
# Une soumission manuelle reste possible via le workflow « IndexNow ».
#
# Prérequis serveur :
#   - deploy dans le groupe www-data (sudo usermod -aG www-data deploy)
#   - Projet : chown www-data:www-data, chmod 775/664, SGID sur les répertoires
#   - PHP-FPM : UMask=0002 via systemd override
#   - /usr/local/bin/restart-php-fpm : script root-owned (chmod 755) qui restarte
#     tous les pools php*-fpm pour purger l'OPcache (le reload ne le vide pas).
#     Ne touche NI Apache NI MySQL.
#   - sudoers : deploy autorisé à `/usr/local/bin/restart-php-fpm` sans mot de passe
#     (sinon workers FPM en erreur 503 après déploiement)
#   - INDEXNOW_KEY renseignée dans le .env de production pour que la soumission
#     IndexNow aboutisse (sans elle, la commande échoue sans bloquer le déploiement)
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   - SSH_HOST : adresse IP ou domaine du serveur
#   - SSH_USER : utilisateur SSH (ex: deploy)
#   - SSH_KEY : clé privée SSH ed25519
#   - SSH_PORT : port SSH (si différent de 22)
#   - SSH_PATH : chemin du projet sur le serveur (ex: /var/www/secret-drop)

name: CD
run-name: "CD — ${{ github.event_name == 'workflow_dispatch' && 'manual' || format('{0}: {1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_commit.message) }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Build assets
        run: npm ci && npm run build

      - name: Clean old build assets
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: rm -rf ${{ secrets.SSH_PATH }}/public/build/

      - name: Transfer built assets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build/"
          target: ${{ secrets.SSH_PATH }}
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            umask 002
            cd ${{ secrets.SSH_PATH }}

            # Révision avant le pull : sert à détecter les changements de contenu
            # (git checkout -- . et git pull ne déplacent pas cette référence)
            BEFORE=$(git rev-parse HEAD)

            php artisan down --retry=60 || true

            git checkout -- .
            git pull --ff-only origin main

            printf '%s\n%s\n' "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cI)" > VERSION

            rm -f bootstrap/cache/*.php
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            sudo /usr/local/bin/restart-php-fpm

            php artisan up

            # IndexNow : après la remise en ligne, et sans jamais faire échouer
            # le déploiement. La forme "if ... then" évite qu'un grep sans
            # correspondance (code 1) n'avorte le script à cause de set -e.
            AFTER=$(git rev-parse HEAD)
            CONTENT_PATHS='^(lang/[a-z]{2}/(messages|routes)\.php|resources/views/(layouts|components)/|resources/views/(faq|how-it-works|use-cases|legal|sitemap)\.blade\.php|resources/views/secrets/create\.blade\.php|app/Support/LocaleConfig\.php)'

            if [ "$BEFORE" = "$AFTER" ]; then
              echo "IndexNow : soumission sautée — aucun nouveau commit déployé ($BEFORE)"
            elif git diff --name-only "$BEFORE" "$AFTER" | grep -qE "$CONTENT_PATHS"; then
              echo "IndexNow : contenu éditorial modifié entre $BEFORE et $AFTER — soumission en cours"
              git diff --name-only "$BEFORE" "$AFTER" | grep -E "$CONTENT_PATHS" || true
              php artisan indexnow:submit || echo "IndexNow : soumission en échec (déploiement non impacté)"
            else
              echo "IndexNow : soumission sautée — aucun contenu éditorial modifié entre $BEFORE et $AFTER"
            fi
