# Auto-merge des PR Dependabot — périmètre volontairement étroit.
#
# PÉRIMÈTRE
#   On active l'auto-merge UNIQUEMENT pour les mises à jour patch et mineures
#   des dépendances de DÉVELOPPEMENT (dependency-type == 'direct:development').
#   Tout le reste — majeures, dépendances de production, dépendances
#   indirectes — n'est pas touché et reste en revue manuelle. Le workflow ne
#   tombe jamais en échec dans ces cas : il ne fait simplement rien.
#
#   Sur les PR groupées, fetch-metadata agrège en prenant le maximum : un
#   groupe qui contient ne serait-ce qu'une dépendance de production sort
#   'direct:production', et un groupe qui contient une majeure sort
#   'version-update:semver-major'. Les deux garde-fous tiennent donc aussi
#   pour les groupes (ce dépôt utilise des groupes Dependabot).
#
# POURQUOI LE CONTRÔLE SUR LE DÉPÔT DE LA BRANCHE SOURCE
#   `pull_request_target` s'exécute dans le contexte du dépôt de base, avec un
#   GITHUB_TOKEN en écriture et l'accès aux secrets. Vérifier seulement l'auteur
#   ou le nom de branche ne suffit pas : n'importe qui peut forker, nommer sa
#   branche `dependabot/...`, et une PR de fork serait auto-mergée. On exige
#   donc les DEUX conditions :
#     - l'auteur de la PR est littéralement `dependabot[bot]` ;
#     - la branche source vit dans CE dépôt
#       (head.repo.full_name == github.repository), donc pas un fork.
#
#   Corollaire : ce workflow ne fait JAMAIS de checkout et n'exécute AUCUN code
#   de la PR (pas d'actions/checkout, pas de npm, pas de composer, pas de script
#   du dépôt). Il ne lit que des métadonnées via l'API. C'est ce qui rend
#   `pull_request_target` acceptable ici.
#
# DEUX PRÉREQUIS CÔTÉ DÉPÔT (sans eux, ce workflow est inutile ou dangereux)
#   1. « Allow auto-merge » doit être activé dans Settings → General du dépôt,
#      sinon `gh pr merge --auto` échoue.
#   2. Des status checks REQUIS doivent être configurés sur `main` (protection
#      de branche ou ruleset). C'est le point critique : `--auto` ne fait
#      qu'armer la fusion, qui se déclenche dès que la PR devient mergeable.
#      S'il n'y a aucun check requis, la PR est mergeable immédiatement et
#      CE WORKFLOW FUSIONNERAIT DU CODE NON TESTÉ, sans attendre la CI.
#
# STYLE DE FUSION
#   `--merge` et non `--squash` : le squash est désactivé sur ce dépôt et
#   l'historique est fait de commits de merge.

name: Dependabot auto-merge

on: pull_request_target

# Strict minimum documenté pour armer l'auto-merge sous pull_request_target.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Récupérer les métadonnées Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Armer l'auto-merge (dev, patch et mineur uniquement)
        if: >-
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ github.token }}
